<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 分割工具 — PDF Splitter</title>
<meta name="description" content="純前端 PDF 分割工具，無需上傳，瀏覽器內處理，支援每 N 頁、範圍、指定頁三種模式。">
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d23;
    --panel-2: #232830;
    --border: #2d333c;
    --text: #e6e8eb;
    --text-dim: #8b95a3;
    --accent: #4f9eff;
    --accent-hover: #6db0ff;
    --success: #4ade80;
    --warning: #fbbf24;
    --danger: #ef4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  .header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header .badge {
    font-size: 11px;
    background: var(--panel-2);
    color: var(--text-dim);
    padding: 3px 8px;
    border-radius: 4px;
    font-weight: 500;
  }
  .header .privacy {
    margin-left: auto;
    font-size: 12px;
    color: var(--success);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .container {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 20px;
    padding: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }

  @media (max-width: 900px) {
    .container { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px;
  }

  .panel h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    margin-bottom: 14px;
    font-weight: 600;
  }

  /* Drop zone */
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--panel-2);
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    background: rgba(79, 158, 255, 0.05);
  }
  .drop-zone .icon { font-size: 36px; margin-bottom: 8px; }
  .drop-zone .hint { color: var(--text-dim); font-size: 13px; margin-top: 6px; }
  .drop-zone input[type=file] { display: none; }

  .file-info {
    background: var(--panel-2);
    border-radius: 6px;
    padding: 12px 14px;
    margin-top: 12px;
    display: none;
  }
  .file-info.show { display: block; }
  .file-info .name { font-size: 13px; font-weight: 500; word-break: break-all; }
  .file-info .meta { color: var(--text-dim); font-size: 12px; margin-top: 4px; }
  .file-info .clear {
    float: right;
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
  }
  .file-info .clear:hover { color: var(--danger); }

  /* Mode selector */
  .mode-tabs { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .mode-tab {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 6px;
    cursor: pointer;
    text-align: left;
    font-size: 13px;
    transition: all 0.15s;
  }
  .mode-tab:hover { border-color: var(--accent); }
  .mode-tab.active {
    background: rgba(79, 158, 255, 0.15);
    border-color: var(--accent);
    color: var(--accent-hover);
  }
  .mode-tab .label { font-weight: 500; display: block; }
  .mode-tab .desc { color: var(--text-dim); font-size: 11px; margin-top: 2px; }

  /* Inputs */
  .input-group { margin-bottom: 12px; }
  .input-group label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .input-group input[type=text],
  .input-group input[type=number] {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 4px;
    font-size: 13px;
    font-family: inherit;
  }
  .input-group input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .input-group .hint { color: var(--text-dim); font-size: 11px; margin-top: 4px; }

  /* Buttons */
  .btn {
    width: 100%;
    padding: 12px 16px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .btn-primary {
    background: var(--accent);
    color: white;
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-primary:disabled {
    background: var(--panel-2);
    color: var(--text-dim);
    cursor: not-allowed;
  }
  .btn-secondary {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    margin-top: 8px;
  }
  .btn-secondary:hover { border-color: var(--accent); }

  /* Output area */
  .output {
    min-height: 400px;
  }
  .output-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 400px;
    color: var(--text-dim);
    text-align: center;
    font-size: 13px;
  }

  .preview-list { list-style: none; }
  .preview-item {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
  }
  .preview-item .idx {
    background: var(--panel);
    color: var(--text-dim);
    width: 24px;
    height: 24px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    flex-shrink: 0;
  }
  .preview-item .name { flex: 1; word-break: break-all; }
  .preview-item .pages { color: var(--text-dim); font-size: 11px; flex-shrink: 0; }

  .preview-error {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid var(--danger);
    border-radius: 6px;
    padding: 10px 14px;
    color: var(--danger);
    font-size: 12px;
    margin-top: 8px;
  }

  /* Status / progress */
  .status {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 12px;
    display: none;
  }
  .status.show { display: block; }
  .status.info {
    background: rgba(79, 158, 255, 0.1);
    color: var(--accent-hover);
  }
  .status.success {
    background: rgba(74, 222, 128, 0.1);
    color: var(--success);
  }
  .status.error {
    background: rgba(239, 68, 68, 0.1);
    color: var(--danger);
  }

  .progress {
    margin-top: 8px;
    height: 4px;
    background: var(--panel-2);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.2s;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 20px;
    color: var(--text-dim);
    font-size: 11px;
  }
  .footer a { color: var(--accent); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="header">
  <h1>📄 PDF 分割工具</h1>
  <span class="badge">v1.0</span>
  <div class="privacy">🔒 100% 瀏覽器處理 · 檔案不上傳</div>
</div>

<div class="container">
  <!-- LEFT: File + Mode -->
  <div>
    <div class="panel" style="margin-bottom: 16px;">
      <h2>1. 載入 PDF</h2>
      <label class="drop-zone" id="dropZone">
        <div class="icon">📁</div>
        <div>拖拽 PDF 到此處</div>
        <div class="hint">或點擊選擇檔案</div>
        <input type="file" id="fileInput" accept="application/pdf">
      </label>
      <div class="file-info" id="fileInfo">
        <button class="clear" id="clearBtn" title="清除">✕</button>
        <div class="name" id="fileName">—</div>
        <div class="meta" id="fileMeta">—</div>
      </div>
    </div>

    <div class="panel">
      <h2>2. 選擇分割模式</h2>
      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="every-n">
          <span class="label">每 N 頁一份</span>
          <span class="desc">每 N 頁切一份，例如 N=3 → 3 頁一組</span>
        </button>
        <button class="mode-tab" data-mode="ranges">
          <span class="label">自訂範圍</span>
          <span class="desc">用範圍語法，每段一份 PDF</span>
        </button>
        <button class="mode-tab" data-mode="extract">
          <span class="label">只保留指定頁</span>
          <span class="desc">全部合併成一份 PDF</span>
        </button>
      </div>

      <div id="modeConfig">
        <!-- Populated by JS -->
      </div>

      <button class="btn btn-primary" id="processBtn" disabled>⚡ 開始分割</button>
      <div class="status" id="status"></div>
    </div>
  </div>

  <!-- RIGHT: Preview -->
  <div>
    <div class="panel output">
      <h2>3. 預覽輸出</h2>
      <div id="outputContent">
        <div class="output-empty">載入 PDF 後會顯示輸出預覽</div>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  PDF 分割工具 · 純前端實作 · 由 <a href="https://github.com/ai-lish/pdf-splitter" target="_blank">ai-lish/pdf-splitter</a> 提供
</div>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(() => {
  const { PDFDocument } = PDFLib;

  // State
  let pdfFile = null;       // File object
  let pdfDoc = null;        // Loaded PDFDocument
  let pdfBytes = null;      // Raw bytes
  let currentMode = 'every-n';
  let currentRanges = [];   // Array of page index arrays (0-based)
  let currentFilenames = []; // Array of filenames
  let lastZipBlob = null;   // Generated ZIP for re-download

  // Elements
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const fileInfo = document.getElementById('fileInfo');
  const fileName = document.getElementById('fileName');
  const fileMeta = document.getElementById('fileMeta');
  const clearBtn = document.getElementById('clearBtn');
  const modeConfig = document.getElementById('modeConfig');
  const processBtn = document.getElementById('processBtn');
  const status = document.getElementById('status');
  const outputContent = document.getElementById('outputContent');

  // ========== File handling ==========
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type === 'application/pdf') loadFile(file);
    else showStatus('請選擇 PDF 檔案', 'error');
  });
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) loadFile(file);
  });
  clearBtn.addEventListener('click', resetAll);

  async function loadFile(file) {
    try {
      showStatus('載入 PDF 中…', 'info');
      pdfFile = file;
      pdfBytes = await file.arrayBuffer();
      // Load with pdf-lib (need a fresh copy to avoid detached buffer)
      pdfDoc = await PDFDocument.load(pdfBytes.slice(0));
      const pageCount = pdfDoc.getPageCount();
      const sizeStr = formatBytes(file.size);

      fileName.textContent = file.name;
      fileMeta.textContent = `${pageCount} 頁 · ${sizeStr}`;
      fileInfo.classList.add('show');

      updatePreview();
      processBtn.disabled = false;
      hideStatus();
    } catch (err) {
      console.error(err);
      showStatus('無法讀取 PDF：' + err.message, 'error');
      resetAll();
    }
  }

  function resetAll() {
    pdfFile = null;
    pdfDoc = null;
    pdfBytes = null;
    currentRanges = [];
    currentFilenames = [];
    lastZipBlob = null;
    fileInfo.classList.remove('show');
    fileInput.value = '';
    processBtn.disabled = true;
    outputContent.innerHTML = '<div class="output-empty">載入 PDF 後會顯示輸出預覽</div>';
    hideStatus();
  }

  // ========== Mode selector ==========
  document.querySelectorAll('.mode-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentMode = tab.dataset.mode;
      renderModeConfig();
      updatePreview();
    });
  });

  function renderModeConfig() {
    if (currentMode === 'every-n') {
      modeConfig.innerHTML = `
        <div class="input-group">
          <label>每幾頁一份？</label>
          <input type="number" id="nInput" min="1" value="1">
          <div class="hint">例：3 → 將 1-3、4-6、7-9 各自一份</div>
        </div>
      `;
      const nInput = document.getElementById('nInput');
      nInput.addEventListener('input', updatePreview);
    } else if (currentMode === 'ranges') {
      modeConfig.innerHTML = `
        <div class="input-group">
          <label>範圍（每段一份 PDF）</label>
          <input type="text" id="rangesInput" placeholder="例如：1-3, 5, 7-9">
          <div class="hint">逗號分隔；連字號表示範圍；單數字表示單頁</div>
        </div>
      `;
      const rangesInput = document.getElementById('rangesInput');
      rangesInput.addEventListener('input', updatePreview);
    } else if (currentMode === 'extract') {
      modeConfig.innerHTML = `
        <div class="input-group">
          <label>要保留的頁（合成一份）</label>
          <input type="text" id="rangesInput" placeholder="例如：1, 3, 5-7">
          <div class="hint">只保留你列嘅頁，順序照輸入</div>
        </div>
      `;
      const rangesInput = document.getElementById('rangesInput');
      rangesInput.addEventListener('input', updatePreview);
    }
  }

  // ========== Range parsing ==========
  function parseRanges(text, totalPages) {
    // Returns {chunks: [[1,2,3], [5], [7,8,9]], error: null}
    // 1-based user input → 0-based output
    if (!text || !text.trim()) {
      return { chunks: [], error: '請輸入範圍' };
    }

    const chunks = [];
    const parts = text.split(/[,\s]+/).filter(Boolean);
    for (const part of parts) {
      const m = part.match(/^(\d+)(?:\s*-\s*(\d+))?$/);
      if (!m) {
        return { chunks: [], error: `無效範圍：「${part}」` };
      }
      let start = parseInt(m[1], 10);
      let end = m[2] ? parseInt(m[2], 10) : start;
      if (start > end) [start, end] = [end, start];
      if (start < 1 || end > totalPages) {
        return { chunks: [], error: `頁碼超出範圍：${start}-${end}（總共 ${totalPages} 頁）` };
      }
      const chunk = [];
      for (let i = start; i <= end; i++) chunk.push(i - 1);
      chunks.push(chunk);
    }
    return { chunks, error: null };
  }

  // ========== Preview ==========
  function updatePreview() {
    if (!pdfDoc) return;
    const totalPages = pdfDoc.getPageCount();
    const baseName = pdfFile.name.replace(/\.pdf$/i, '');

    let result = { chunks: [], error: null };

    if (currentMode === 'every-n') {
      const n = parseInt(document.getElementById('nInput')?.value || '1', 10);
      if (!n || n < 1) {
        renderPreview([], [], '每頁數量必須 ≥ 1');
        return;
      }
      const chunks = [];
      for (let i = 0; i < totalPages; i += n) {
        const chunk = [];
        for (let j = i; j < Math.min(i + n, totalPages); j++) chunk.push(j);
        chunks.push(chunk);
      }
      const names = chunks.map((c, i) => `${baseName}-${pad(i + 1, String(chunks.length).length)}.pdf`);
      renderPreview(chunks, names, null);
    } else if (currentMode === 'ranges' || currentMode === 'extract') {
      const text = document.getElementById('rangesInput')?.value || '';
      const parsed = parseRanges(text, totalPages);
      if (parsed.error) {
        renderPreview([], [], parsed.error);
        return;
      }
      if (currentMode === 'extract') {
        // Merge all chunks → single output
        const merged = parsed.chunks.flat();
        const names = [`${baseName}-selected.pdf`];
        renderPreview([merged], names, null);
      } else {
        // Each chunk → separate output
        const names = parsed.chunks.map(chunk => {
          const first = chunk[0] + 1;
          const last = chunk[chunk.length - 1] + 1;
          const label = first === last ? `${first}` : `${first}-${last}`;
          return `${baseName}-${label}.pdf`;
        });
        renderPreview(parsed.chunks, names, null);
      }
    }
  }

  function pad(n, w) { return String(n).padStart(w, '0'); }

  function renderPreview(chunks, names, error) {
    if (error) {
      outputContent.innerHTML = `
        <div class="preview-error">⚠ ${escapeHtml(error)}</div>
      `;
      processBtn.disabled = true;
      currentRanges = [];
      currentFilenames = [];
      return;
    }
    if (chunks.length === 0) {
      outputContent.innerHTML = `<div class="output-empty">設定正確的分割方式</div>`;
      processBtn.disabled = true;
      currentRanges = [];
      currentFilenames = [];
      return;
    }
    const items = chunks.map((chunk, i) => `
      <li class="preview-item">
        <div class="idx">${i + 1}</div>
        <div class="name">${escapeHtml(names[i])}</div>
        <div class="pages">${chunk.length} 頁</div>
      </li>
    `).join('');
    const totalOut = chunks.reduce((s, c) => s + c.length, 0);
    const summary = chunks.length === 1
      ? `1 個檔案 · ${totalOut} 頁`
      : `${chunks.length} 個檔案 · 合計 ${totalOut} 頁`;
    outputContent.innerHTML = `
      <div style="color: var(--text-dim); font-size: 12px; margin-bottom: 10px;">
        ${summary}
      </div>
      <ul class="preview-list">${items}</ul>
    `;
    currentRanges = chunks;
    currentFilenames = names;
    processBtn.disabled = false;
  }

  // ========== Process ==========
  processBtn.addEventListener('click', async () => {
    if (!pdfDoc || currentRanges.length === 0) return;
    processBtn.disabled = true;
    showStatus('生成 PDF 中…', 'info', true, 0);

    try {
      const zip = new JSZip();
      for (let i = 0; i < currentRanges.length; i++) {
        const chunk = currentRanges[i];
        const newDoc = await PDFDocument.create();
        const copied = await newDoc.copyPages(pdfDoc, chunk);
        copied.forEach(p => newDoc.addPage(p));
        const bytes = await newDoc.save();
        zip.file(currentFilenames[i], bytes);
        const pct = Math.round(((i + 1) / currentRanges.length) * 100);
        showStatus(`生成中：${i + 1} / ${currentRanges.length}`, 'info', true, pct);
      }
      const zipBlob = await zip.generateAsync({ type: 'blob' });
      lastZipBlob = zipBlob;
      downloadBlob(zipBlob, makeZipName());
      showStatus(`✅ 完成！下載咗 ${currentRanges.length} 個 PDF`, 'success');
      appendRedownload();
    } catch (err) {
      console.error(err);
      showStatus('❌ 處理失敗：' + err.message, 'error');
    } finally {
      processBtn.disabled = false;
    }
  });

  function appendRedownload() {
    const btn = document.createElement('button');
    btn.className = 'btn btn-secondary';
    btn.textContent = '⬇ 重新下載 ZIP';
    btn.onclick = () => {
      if (lastZipBlob) downloadBlob(lastZipBlob, makeZipName());
    };
    status.appendChild(btn);
  }

  function makeZipName() {
    const base = pdfFile.name.replace(/\.pdf$/i, '');
    return `${base}-split-${currentRanges.length}files.zip`;
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 0);
  }

  // ========== Status ==========
  function showStatus(msg, type, showProgress = false, pct = 0) {
    status.className = `status show ${type}`;
    status.innerHTML = msg;
    if (showProgress) {
      status.innerHTML += `<div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>`;
    }
  }
  function hideStatus() {
    status.className = 'status';
    status.innerHTML = '';
  }

  // ========== Utils ==========
  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(1) + ' MB';
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // Init
  renderModeConfig();
})();
</script>

</body>
</html>
